<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="오늘의 습관을 기록하고 달성률을 확인하는 습관 관리 앱" />
  <title>오늘의 습관</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="habit-app" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow" id="today-date"></p>
        <h1 id="app-title">오늘의 습관</h1>
        <p class="greeting" id="greeting"></p>
      </header>

      <section class="progress-card" aria-labelledby="progress-title">
        <div class="progress-ring" id="progress-ring" role="img" aria-label="오늘의 달성률 0퍼센트">
          <div class="progress-center">
            <strong id="progress-percent">0%</strong>
            <span>오늘의 달성률</span>
          </div>
        </div>
        <div class="progress-copy">
          <h2 id="progress-title">좋은 하루를 만들어요</h2>
          <p><strong id="completed-count">0</strong>개 완료 · 전체 <strong id="total-count">0</strong>개</p>
        </div>
      </section>

      <section class="habits-section" aria-labelledby="habits-title">
        <div class="section-heading">
          <h2 id="habits-title">오늘 할 일</h2>
          <span id="habit-summary" aria-live="polite"></span>
        </div>
        <ul class="habit-list" id="habit-list" aria-live="polite"></ul>
        <p class="empty-message" id="empty-message" hidden>아직 습관이 없어요. 첫 습관을 추가해 보세요.</p>
      </section>

      <form class="add-form" id="add-form">
        <label class="sr-only" for="habit-input">새 습관</label>
        <input id="habit-input" type="text" maxlength="50" placeholder="새로운 습관을 입력하세요" autocomplete="off" required />
        <button type="submit" aria-label="습관 추가">추가</button>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
